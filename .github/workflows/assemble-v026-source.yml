name: Assemble v026 source

on:
  push:
    branches: [lob-v026-source]
    paths:
      - 'lob/v026_staging/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lob-v026-source
          fetch-depth: 0
      - name: Reconstruct verified v026 and keep source only
        shell: bash
        run: |
          set -euo pipefail
          cat lob/v026_staging/part*.b64 > /tmp/v026.b64
          base64 --decode /tmp/v026.b64 > /tmp/v026.zip
          rm -rf /tmp/v026_extract
          mkdir -p /tmp/v026_extract
          unzip -q /tmp/v026.zip -d /tmp/v026_extract
          src=/tmp/v026_extract/lob_notebook_eval_model_selector_v1_0_cpp_v026
          test -d "$src"
          find "$src" -type d -name '__pycache__' -prune -exec rm -rf {} +
          find "$src" -type f -name '*.pyc' -delete
          dst=lob/lob_notebook_eval_model_selector_v1_0_cpp_v026
          rm -rf "$dst"
          mkdir -p "$dst"
          cp -a "$src"/. "$dst"/
          rm -rf lob/v026_staging
          rm -f .github/workflows/assemble-v026-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add LOB v026 expanded source tree'
          git push origin HEAD:lob-v026-source
